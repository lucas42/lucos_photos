<div class="lightbox" id="merge-prompt-lightbox" role="dialog" aria-modal="true" aria-labelledby="merge-prompt-title">
    <div class="merge-prompt">
        <h2 id="merge-prompt-title">Merge people?</h2>
        <p>This contact is already linked to another person. Would you like to merge them?</p>
        <div class="merge-prompt-people">
            <div class="merge-prompt-person" id="merge-prompt-current">
                <div class="person-profile-picture-placeholder"></div>
                <span class="merge-prompt-person-name"></span>
            </div>
            <div class="merge-prompt-arrow">→</div>
            <div class="merge-prompt-person" id="merge-prompt-existing">
                <div class="person-profile-picture-placeholder"></div>
                <span class="merge-prompt-person-name"></span>
            </div>
        </div>
        <div class="merge-prompt-actions">
            <button class="merge-prompt-cancel" id="merge-prompt-cancel">Cancel</button>
            <button class="merge-prompt-confirm" id="merge-prompt-confirm">Merge</button>
        </div>
        <p class="merge-prompt-error" id="merge-prompt-error" hidden></p>
    </div>
</div>
