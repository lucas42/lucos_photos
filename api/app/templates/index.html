{% extends "_base.html" %}

{% block meta %}<meta name="description" content="A simple and elegant photo management service.">{% endblock %}

{% block content %}
<div class="container" id="app">
    <div id="photo-grid" class="photo-grid">
        <!-- Populated by JS -->
    </div>
    {% set pagination = {"show": false, "summary": "", "prev_url": none, "prev_label": "", "next_url": none, "next_label": ""} %}
    {% include "_pagination.html" %}
</div>
{% endblock %}

<!-- Lightbox overlay -->
{% block scripts %}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-inner" id="lightbox-inner">
        <!-- Photo or video element injected by JS -->
    </div>
</div>

<script>
    const grid = document.getElementById('photo-grid');
    const paginationBar = document.getElementById('pagination-bar');
    const paginationPrev = document.getElementById('pagination-prev');
    const paginationSummary = document.getElementById('pagination-summary');
    const paginationNext = document.getElementById('pagination-next');
    const lightbox = document.getElementById('lightbox');
    const lightboxInner = document.getElementById('lightbox-inner');
    const lightboxClose = document.getElementById('lightbox-close');

    const PAGE_SIZE = 200;

    // ------------------------------------------------------------------
    // Pagination helpers
    // ------------------------------------------------------------------

    function getCurrentPage() {
        const params = new URLSearchParams(window.location.search);
        const page = parseInt(params.get('page'), 10);
        return (Number.isInteger(page) && page >= 1) ? page : 1;
    }

    function pageUrl(page) {
        const params = new URLSearchParams(window.location.search);
        params.set('page', page);
        return '?' + params.toString();
    }

    function renderPagination(page, offset, fetchedCount, total) {
        const hasPrevious = offset > 0;
        const hasNext = offset + fetchedCount < total;
        const show = hasPrevious || hasNext;

        if (show) {
            paginationBar.classList.remove('pagination-bar--hidden');
        } else {
            paginationBar.classList.add('pagination-bar--hidden');
        }

        // Previous slot
        paginationPrev.innerHTML = '';
        if (hasPrevious) {
            const a = document.createElement('a');
            a.href = pageUrl(page - 1);
            a.textContent = `<- Page ${page - 1}`;
            a.className = 'pagination-link';
            paginationPrev.appendChild(a);
        }

        // Summary
        if (show) {
            const start = offset + 1;
            const end = Math.min(offset + fetchedCount, total);
            paginationSummary.textContent = `Showing ${start}–${end} of ${total}`;
        } else {
            paginationSummary.textContent = '';
        }

        // Next slot
        paginationNext.innerHTML = '';
        if (hasNext) {
            const a = document.createElement('a');
            a.href = pageUrl(page + 1);
            a.textContent = `Page ${page + 1} ->`;
            a.className = 'pagination-link';
            paginationNext.appendChild(a);
        }
    }

    // ------------------------------------------------------------------
    // Lightbox
    // ------------------------------------------------------------------

    function openLightbox(mediaItem) {
        lightboxInner.innerHTML = '';

        if (mediaItem.mediaType === 'video') {
            const video = document.createElement('video');
            video.src = mediaItem.originalUrl;
            video.controls = true;
            video.autoplay = true;
            video.preload = 'metadata';
            lightboxInner.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = mediaItem.originalUrl;
            img.alt = 'Photo';
            lightboxInner.appendChild(img);
        }

        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
        lightboxClose.focus();
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        // Pause any playing video to stop audio/network activity
        const video = lightboxInner.querySelector('video');
        if (video) video.pause();
        lightboxInner.innerHTML = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) {
            closeLightbox();
        }
    });

    // ------------------------------------------------------------------
    // Media card rendering
    // ------------------------------------------------------------------

    function renderEmptyState() {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6.75a1.5 1.5 0 00-1.5-1.5H3.75a1.5 1.5 0 00-1.5 1.5v12.75a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
            </svg>
            <p>No photos here yet.</p>
        `;
        grid.appendChild(div);
    }

    function renderProcessingCard() {
        const card = document.createElement('div');
        card.className = 'media-card processing';
        card.innerHTML = `
            <div class="spinner"></div>
            <span class="processing-label">Processing&hellip;</span>
        `;
        return card;
    }

    function renderVideoPlayOverlay() {
        const overlay = document.createElement('div');
        overlay.className = 'play-overlay';
        overlay.innerHTML = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
            </svg>
        `;
        return overlay;
    }

    function renderMediaCard(item) {
        const isVideo = item.mediaType === 'video';

        const link = document.createElement('a');
        link.href = `/photos/${item.id}`;
        link.className = 'media-card-link';

        const card = document.createElement('div');
        card.className = 'media-card';

        const img = document.createElement('img');
        img.alt = isVideo ? 'Video' : 'Photo';
        img.loading = 'lazy';

        if (isVideo) {
            img.src = item.thumbnailUrl;
            img.onerror = () => {
                // Thumbnail not yet available — replace card with processing state
                card.innerHTML = '';
                card.className = 'media-card processing';
                card.innerHTML = `
                    <div class="spinner"></div>
                    <span class="processing-label">Processing&hellip;</span>
                `;
                card.removeEventListener('click', clickHandler);
            };
            card.appendChild(img);
            card.appendChild(renderVideoPlayOverlay());
        } else {
            img.src = item.thumbnailUrl;
            card.appendChild(img);
        }

        // Left-click opens lightbox; right-click / middle-click / "Open in new tab"
        // uses the native browser behaviour via the <a> href.
        function clickHandler(e) {
            if (e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                e.preventDefault();
                openLightbox(item);
            }
        }

        link.addEventListener('click', clickHandler);
        link.appendChild(card);

        return link;
    }

    // ------------------------------------------------------------------
    // Load media from API
    // ------------------------------------------------------------------

    // Track current pagination state so we can decide if a new photo belongs here.
    let currentOffset = 0;
    let currentTotal = 0;
    let currentCount = 0;

    async function loadMedia() {
        const page = getCurrentPage();
        const offset = (page - 1) * PAGE_SIZE;

        try {
            const response = await fetch(`/photos?limit=${PAGE_SIZE}&offset=${offset}`);
            if (!response.ok) {
                throw new Error(`API responded with ${response.status}`);
            }
            const data = await response.json();
            const items = data.photos || [];
            const total = data.total || 0;

            currentOffset = offset;
            currentTotal = total;
            currentCount = items.length;

            grid.innerHTML = '';

            if (items.length === 0 && page === 1) {
                renderEmptyState();
                return;
            }

            for (const item of items) {
                grid.appendChild(renderMediaCard(item));
            }

            renderPagination(page, offset, items.length, total);
        } catch (err) {
            console.error('Failed to load media:', err);
            grid.innerHTML = '';
            renderEmptyState();
        }
    }

    loadMedia();

    // ------------------------------------------------------------------
    // WebSocket: live photo updates
    // ------------------------------------------------------------------

    function connectWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${location.host}/stream`);

        socket.addEventListener('message', async (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }

            if (msg.type !== 'photoProcessed') return;

            // Only insert on page 1 (offset 0). Newly-processed photos sort to the
            // front (most recent uploaded_at), so they always land at the top of page 1.
            if (currentOffset !== 0) return;

            try {
                const res = await fetch(`/photos/${msg.photoId}`);
                if (!res.ok) return;
                const item = await res.json();

                // Remove empty-state placeholder if present
                const emptyState = grid.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                // Prepend the new card
                const card = renderMediaCard(item);
                grid.insertBefore(card, grid.firstChild);

                // Update our local counters
                currentCount++;
                currentTotal++;

                // If the page is now over-full, drop the last card (it shifts to page 2)
                if (currentCount > PAGE_SIZE) {
                    const cards = grid.querySelectorAll('.media-card-link');
                    if (cards.length > PAGE_SIZE) {
                        grid.removeChild(cards[cards.length - 1]);
                        currentCount = PAGE_SIZE;
                    }
                }

                renderPagination(getCurrentPage(), currentOffset, currentCount, currentTotal);
            } catch (err) {
                console.error('WebSocket: failed to fetch new photo', err);
            }
        });

        socket.addEventListener('close', () => {
            // Reconnect after a brief delay
            setTimeout(connectWebSocket, 3000);
        });
    }

    connectWebSocket();
</script>
{% endblock %}
