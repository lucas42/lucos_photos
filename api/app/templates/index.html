{% extends "_base.html" %}

{% block meta %}<meta name="description" content="A simple and elegant photo management service.">{% endblock %}

{% block content %}
<div class="container" id="app">
    <div id="photo-grid" class="photo-grid">
        <!-- Populated by JS -->
    </div>
    <nav class="pagination" id="pagination" aria-label="Photo pagination">
        <!-- Populated by JS -->
    </nav>
</div>
{% endblock %}

<!-- Lightbox overlay -->
{% block scripts %}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-inner" id="lightbox-inner">
        <!-- Photo or video element injected by JS -->
    </div>
</div>

<script>
    const grid = document.getElementById('photo-grid');
    const pagination = document.getElementById('pagination');
    const lightbox = document.getElementById('lightbox');
    const lightboxInner = document.getElementById('lightbox-inner');
    const lightboxClose = document.getElementById('lightbox-close');

    const PAGE_SIZE = 200;

    // ------------------------------------------------------------------
    // Pagination helpers
    // ------------------------------------------------------------------

    function getCurrentPage() {
        const params = new URLSearchParams(window.location.search);
        const page = parseInt(params.get('page'), 10);
        return (Number.isInteger(page) && page >= 1) ? page : 1;
    }

    function pageUrl(page) {
        const params = new URLSearchParams(window.location.search);
        params.set('page', page);
        return '?' + params.toString();
    }

    function renderPagination(page, offset, fetchedCount, total) {
        pagination.innerHTML = '';

        const hasPrevious = offset > 0;
        const hasNext = offset + fetchedCount < total;

        if (hasPrevious) {
            const a = document.createElement('a');
            a.href = pageUrl(page - 1);
            a.textContent = 'Previous';
            a.className = 'pagination-link pagination-prev';
            pagination.appendChild(a);
        }

        if (hasNext) {
            const a = document.createElement('a');
            a.href = pageUrl(page + 1);
            a.textContent = 'Next';
            a.className = 'pagination-link pagination-next';
            pagination.appendChild(a);
        }
    }

    // ------------------------------------------------------------------
    // Lightbox
    // ------------------------------------------------------------------

    function openLightbox(mediaItem) {
        lightboxInner.innerHTML = '';

        if (mediaItem.mediaType === 'video') {
            const video = document.createElement('video');
            video.src = mediaItem.originalUrl;
            video.controls = true;
            video.autoplay = true;
            video.preload = 'metadata';
            lightboxInner.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = mediaItem.originalUrl;
            img.alt = `Photo ${mediaItem.id}`;
            lightboxInner.appendChild(img);
        }

        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        // Pause any playing video to stop audio/network activity
        const video = lightboxInner.querySelector('video');
        if (video) video.pause();
        lightboxInner.innerHTML = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) {
            closeLightbox();
        }
    });

    // ------------------------------------------------------------------
    // Media card rendering
    // ------------------------------------------------------------------

    function renderEmptyState() {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6.75a1.5 1.5 0 00-1.5-1.5H3.75a1.5 1.5 0 00-1.5 1.5v12.75a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
            </svg>
            <p>No photos here yet.</p>
        `;
        grid.appendChild(div);
    }

    function renderProcessingCard() {
        const card = document.createElement('div');
        card.className = 'media-card processing';
        card.innerHTML = `
            <div class="spinner"></div>
            <span class="processing-label">Processing&hellip;</span>
        `;
        return card;
    }

    function renderVideoPlayOverlay() {
        const overlay = document.createElement('div');
        overlay.className = 'play-overlay';
        overlay.innerHTML = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
            </svg>
        `;
        return overlay;
    }

    function renderMediaCard(item) {
        const isVideo = item.mediaType === 'video';

        const link = document.createElement('a');
        link.href = `/photos/${item.id}`;
        link.className = 'media-card-link';

        const card = document.createElement('div');
        card.className = 'media-card';

        const img = document.createElement('img');
        img.alt = isVideo ? `Video ${item.id}` : `Photo ${item.id}`;
        img.loading = 'lazy';

        if (isVideo) {
            img.src = item.thumbnailUrl;
            img.onerror = () => {
                // Thumbnail not yet available — replace card with processing state
                card.innerHTML = '';
                card.className = 'media-card processing';
                card.innerHTML = `
                    <div class="spinner"></div>
                    <span class="processing-label">Processing&hellip;</span>
                `;
                card.removeEventListener('click', clickHandler);
            };
            card.appendChild(img);
            card.appendChild(renderVideoPlayOverlay());
        } else {
            img.src = item.thumbnailUrl;
            card.appendChild(img);
        }

        // Left-click opens lightbox; right-click / middle-click / "Open in new tab"
        // uses the native browser behaviour via the <a> href.
        function clickHandler(e) {
            if (e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                e.preventDefault();
                openLightbox(item);
            }
        }

        link.addEventListener('click', clickHandler);
        link.appendChild(card);

        return link;
    }

    // ------------------------------------------------------------------
    // Load media from API
    // ------------------------------------------------------------------

    async function loadMedia() {
        const page = getCurrentPage();
        const offset = (page - 1) * PAGE_SIZE;

        try {
            const response = await fetch(`/photos?limit=${PAGE_SIZE}&offset=${offset}`);
            if (!response.ok) {
                throw new Error(`API responded with ${response.status}`);
            }
            const data = await response.json();
            const items = data.photos || [];
            const total = data.total || 0;

            grid.innerHTML = '';

            if (items.length === 0 && page === 1) {
                renderEmptyState();
                return;
            }

            for (const item of items) {
                grid.appendChild(renderMediaCard(item));
            }

            renderPagination(page, offset, items.length, total);
        } catch (err) {
            console.error('Failed to load media:', err);
            grid.innerHTML = '';
            renderEmptyState();
        }
    }

    loadMedia();
</script>
{% endblock %}
