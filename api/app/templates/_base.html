<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block meta %}{% endblock %}
    <link rel="icon" href="/icon.png" />
    <link href="/style.css" rel="stylesheet" />
    <title>{% block title %}Photos{% endblock %}</title>
</head>

<body>
    <lucos-navbar font="'Pinyon', cursive" title-padding="4px">Photos</lucos-navbar>
    <nav class="site-nav" aria-label="Site navigation">
        <a href="/" {% if current_page == 'home' %}class="current-page"{% endif %}>Home</a>
        <a href="/photos" {% if current_page == 'photos' %}class="current-page"{% endif %}>Photos</a>
        <a href="/people" {% if current_page == 'people' %}class="current-page"{% endif %}>People</a>
        <a href="/app">App</a>
    </nav>

    <div class="bg-glow">
        <div class="glow-ball"></div>
        <div class="glow-ball glow-ball-2"></div>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="/lucos_navbar.js" type="text/javascript"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
