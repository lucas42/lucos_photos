<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/icon.png" />
    <link href="/style.css" rel="stylesheet" />
    <title>People — Photos</title>
</head>

<body>
    <lucos-navbar font="'Pinyon', cursive" title-padding="4px">Photos</lucos-navbar>
    <nav class="site-nav" aria-label="Site navigation">
        <a href="/">Photos</a>
        <a href="/people" class="current-page">People</a>
        <a href="/app">App</a>
    </nav>

    <div class="bg-glow">
        <div class="glow-ball"></div>
        <div class="glow-ball glow-ball-2"></div>
    </div>

    <main>
        <div class="container">
            <h1 class="page-title">People</h1>
            <div id="people-list" class="people-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>

    <script src="/lucos_navbar.js" type="text/javascript"></script>
    <script type="module">
        import '/lucos_search_component.js';

        const ARACHNE_KEY = '__ARACHNE_KEY__';
        const peopleList = document.getElementById('people-list');

        async function loadPeople() {
            try {
                const response = await fetch('/people', {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    throw new Error(`API responded with ${response.status}`);
                }
                const people = await response.json();

                if (people.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'empty-state-text';
                    empty.textContent = 'No people detected yet.';
                    peopleList.appendChild(empty);
                    return;
                }

                for (const person of people) {
                    peopleList.appendChild(renderPersonCard(person));
                }
            } catch (err) {
                console.error('Failed to load people:', err);
                peopleList.innerHTML = '<p class="error">Failed to load people.</p>';
            }
        }

        function renderPersonCard(person) {
            const card = document.createElement('div');
            card.className = 'person-card';
            card.dataset.personId = person.id;

            const header = document.createElement('div');
            header.className = 'person-card-header';

            const name = document.createElement('h2');
            name.className = 'person-name';
            name.textContent = person.name || `Person ${person.id.slice(0, 8)}…`;
            header.appendChild(name);
            card.appendChild(header);

            const contactSection = document.createElement('div');
            contactSection.className = 'person-contact';

            const contactStatus = document.createElement('p');
            contactStatus.className = 'contact-status';
            if (person.contactId) {
                contactStatus.textContent = `Linked to contact: ${person.contactId}`;
                contactStatus.className += ' linked';
            } else {
                contactStatus.textContent = 'Not linked to a contact';
            }
            contactSection.appendChild(contactStatus);

            const searchLabel = document.createElement('label');
            searchLabel.textContent = 'Link to contact: ';
            searchLabel.className = 'search-label';

            const searchWrapper = document.createElement('span');
            searchWrapper.setAttribute('is', 'lucos-search');
            searchWrapper.setAttribute('data-api-key', ARACHNE_KEY);
            searchWrapper.setAttribute('data-types', 'Person');

            const select = document.createElement('select');
            select.id = `contact-search-${person.id}`;
            if (person.contactId) {
                const option = document.createElement('option');
                option.value = `https://contacts.l42.eu/people/${person.contactId}`;
                option.selected = true;
                option.textContent = `https://contacts.l42.eu/people/${person.contactId}`;
                select.appendChild(option);
            }
            searchWrapper.appendChild(select);

            select.addEventListener('change', () => handleContactChange(person.id, select, contactStatus));

            searchLabel.appendChild(searchWrapper);
            contactSection.appendChild(searchLabel);

            if (person.contactId) {
                const unlinkBtn = document.createElement('button');
                unlinkBtn.className = 'unlink-btn';
                unlinkBtn.textContent = 'Unlink contact';
                unlinkBtn.addEventListener('click', () => handleUnlink(person.id, contactStatus, unlinkBtn, select));
                contactSection.appendChild(unlinkBtn);
            }

            card.appendChild(contactSection);
            return card;
        }

        async function handleContactChange(personId, select, statusEl) {
            const selectedValue = select.value;
            if (!selectedValue) return;

            // Extract numeric ID from the URI (e.g. https://contacts.l42.eu/people/42 -> "42")
            const match = selectedValue.match(/\/people\/(\w+)\/?$/);
            if (!match) {
                console.error('Could not extract contact ID from URI:', selectedValue);
                return;
            }
            const contactId = match[1];

            try {
                const response = await fetch(`/people/${personId}/contact`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contactId }),
                });
                if (response.status === 409) {
                    statusEl.textContent = 'This contact is already linked to another person.';
                    statusEl.className = 'contact-status error-status';
                    return;
                }
                if (!response.ok) {
                    throw new Error(`API responded with ${response.status}`);
                }
                statusEl.textContent = `Linked to contact: ${contactId}`;
                statusEl.className = 'contact-status linked';

                // Show unlink button if not already present
                const card = select.closest('.person-card');
                if (card && !card.querySelector('.unlink-btn')) {
                    const unlinkBtn = document.createElement('button');
                    unlinkBtn.className = 'unlink-btn';
                    unlinkBtn.textContent = 'Unlink contact';
                    unlinkBtn.addEventListener('click', () => handleUnlink(personId, statusEl, unlinkBtn, select));
                    select.closest('.person-contact').appendChild(unlinkBtn);
                }
            } catch (err) {
                console.error('Failed to link contact:', err);
                statusEl.textContent = 'Failed to link contact.';
                statusEl.className = 'contact-status error-status';
            }
        }

        async function handleUnlink(personId, statusEl, unlinkBtn, select) {
            try {
                const response = await fetch(`/people/${personId}/contact`, {
                    method: 'DELETE',
                });
                if (!response.ok) {
                    throw new Error(`API responded with ${response.status}`);
                }
                statusEl.textContent = 'Not linked to a contact';
                statusEl.className = 'contact-status';
                unlinkBtn.remove();
                // Clear the search component selection
                select.innerHTML = '';
                // Trigger re-render of the search component
                select.dispatchEvent(new Event('change'));
            } catch (err) {
                console.error('Failed to unlink contact:', err);
                statusEl.textContent = 'Failed to unlink contact.';
                statusEl.className = 'contact-status error-status';
            }
        }

        loadPeople();
    </script>
</body>

</html>
