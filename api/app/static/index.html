<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant photo management service.">
    <title>Photos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --card-bg: #1e293b;
            --empty-color: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        main {
            flex: 1;
            padding: 2.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .container {
            position: relative;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            transition: opacity 0.3s ease;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--empty-color);
            animation: fadeIn 0.8s ease-out;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            stroke-width: 1;
            opacity: 0.8;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .empty-state p {
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0;
        }

        .empty-state:hover svg {
            transform: scale(1.05);
            color: var(--accent-color);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle animated background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-ball {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(60px);
            opacity: 0.3;
            animation: drift 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .glow-ball-2 {
            bottom: -10%;
            right: -10%;
            width: 30vw;
            height: 30vw;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.3) 0%, transparent 70%);
            animation-duration: 25s;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(15vw, 10vh);
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>

<body>
    <lucos-navbar font="'Outfit', sans-serif">Photos</lucos-navbar>

    <div class="bg-glow">
        <div class="glow-ball"></div>
        <div class="glow-ball glow-ball-2"></div>
    </div>

    <main>
        <div class="container" id="app">
            <div id="photo-grid" class="photo-grid">
                <!-- Placeholder / Empty State -->
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6.75a1.5 1.5 0 00-1.5-1.5H3.75a1.5 1.5 0 00-1.5 1.5v12.75a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <p>No photos here yet.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/lucos_navbar.js" type="text/javascript"></script>
    <script>
        // Placeholder for future logic to fetch and display photos
    </script>
</body>

</html>
