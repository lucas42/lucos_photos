services:
  api:
    container_name: lucos_photos_api
    image: lucas42/lucos_photos_api:${VERSION:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - photos:/data/photos
      - uploads:/data/uploads
    environment:
      - SYSTEM
      - ENVIRONMENT
      - PORT
      - APP_ORIGIN
      - POSTGRES_PASSWORD
      - LOGANNE_ENDPOINT
      - LUCOS_CONTACTS_ORIGIN
      - KEY_LUCOS_CONTACTS
      - FACE_SIMILARITY_THRESHOLD
      - KEY_LUCOS_ARACHNE
      - CLIENT_KEYS
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/_info')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    container_name: lucos_photos_worker
    image: lucas42/lucos_photos_worker:${VERSION:-latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - photos:/data/photos
      - uploads:/data/uploads
    environment:
      - SYSTEM
      - ENVIRONMENT
      - APP_ORIGIN
      - POSTGRES_PASSWORD
      - LOGANNE_ENDPOINT
      - LUCOS_CONTACTS_ORIGIN
      - KEY_LUCOS_CONTACTS
      - FACE_SIMILARITY_THRESHOLD
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.from_url(os.environ['REDIS_URL']); r.ping()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g

  postgres:
    container_name: lucos_photos_postgres
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=photos
      - POSTGRES_DB=photos
    restart: unless-stopped

  redis:
    container_name: lucos_photos_redis
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  photos:
  uploads:
  postgres_data:
  redis_data:
