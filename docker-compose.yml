services:
  api:
    container_name: lucos_photos_api
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - photos:/data/photos:ro
    environment:
      - SYSTEM
      - ENVIRONMENT
      - PORT
      - APP_ORIGIN
      - POSTGRES_PASSWORD
      - LOGANNE_ENDPOINT
      - LUCOS_CONTACTS_URL
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - LUCOS_AUTHENTICATION_URL=https://auth.l42.eu
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  worker:
    container_name: lucos_photos_worker
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - photos:/data/photos
    environment:
      - SYSTEM
      - ENVIRONMENT
      - POSTGRES_PASSWORD
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  postgres:
    container_name: lucos_photos_postgres
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=photos
      - POSTGRES_DB=photos
    restart: unless-stopped

  qdrant:
    container_name: lucos_photos_qdrant
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    container_name: lucos_photos_redis
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  photos:
  postgres_data:
  qdrant_data:
