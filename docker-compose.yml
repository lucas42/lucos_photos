services:
  api:
    container_name: lucos_photos_api
    image: lucas42/lucos_photos_api
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - photos:/data/photos:ro
      - uploads:/data/uploads
    environment:
      - SYSTEM
      - ENVIRONMENT
      - PORT
      - APP_ORIGIN
      - POSTGRES_PASSWORD
      - LOGANNE_ENDPOINT
      - LUCOS_CONTACTS_URL
      - CLIENT_KEYS
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
      - LUCOS_AUTHENTICATION_URL=https://auth.l42.eu
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    container_name: lucos_photos_worker
    image: lucas42/lucos_photos_worker
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - photos:/data/photos
      - uploads:/data/uploads
    environment:
      - SYSTEM
      - ENVIRONMENT
      - POSTGRES_PASSWORD
      - POSTGRES_USER=photos
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    container_name: lucos_photos_postgres
    image: pgvector/pgvector:pg16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=photos
      - POSTGRES_DB=photos
    restart: unless-stopped

  redis:
    container_name: lucos_photos_redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  photos:
  uploads:
  postgres_data:
  redis_data:
