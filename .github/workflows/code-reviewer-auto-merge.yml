name: Auto-merge on code reviewer approval
on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on approvals from lucos-code-reviewer[bot] (verified by numeric user ID to prevent impersonation)
    if: |
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'lucos-code-reviewer[bot]' &&
      github.event.review.user.id == 264151378
    steps:
      # Use a GitHub App token instead of GITHUB_TOKEN so that the merge is
      # attributed to the App rather than github-actions[bot]. This ensures
      # closing keywords (e.g. "Closes #N") in PRs are processed by GitHub.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CODE_REVIEWER_PRIVATE_KEY }}
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
